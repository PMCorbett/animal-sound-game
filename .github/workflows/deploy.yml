name: Deploy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build web app for CDK assets
        run: npm run build -w @animal-sound-game/web

      - name: CDK synth
        run: npm run synth

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify GitHub OIDC context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Immutable sub prefix: repo:${{ github.repository_owner }}@*/${{ github.event.repository.name }}@*"
          echo "Push to main sub ends with: :ref:${{ github.ref }}"

      - name: Verify AWS deployment secrets
        id: aws-secrets
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EXPECTED_ROLE_ARN: arn:aws:iam::963777545862:role/AnimalSoundGame-GitHubActionsDeploy
        run: |
          AWS_ROLE_ARN="$(printf '%s' "$AWS_ROLE_ARN" | tr -d '[:space:]')"
          AWS_REGION="$(printf '%s' "$AWS_REGION" | tr -d '[:space:]')"

          missing=()
          [ -z "$AWS_ROLE_ARN" ] && missing+=("AWS_ROLE_ARN")
          [ -z "$AWS_REGION" ] && missing+=("AWS_REGION")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions → Secrets (not Variables)."
            echo "  AWS_ROLE_ARN — $EXPECTED_ROLE_ARN"
            echo "  AWS_REGION — eu-west-2"
            exit 1
          fi

          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]]; then
            echo "::error::AWS_ROLE_ARN does not look like a valid IAM role ARN."
            echo "Expected format: arn:aws:iam::<account-id>:role/<role-name>"
            exit 1
          fi

          if [ "$AWS_ROLE_ARN" != "$EXPECTED_ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN does not match the Animal Sound Game deploy role."
            exit 1
          fi

          echo "role_arn=$AWS_ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "region=$AWS_REGION" >> "$GITHUB_OUTPUT"
          echo "AWS deployment secrets are configured."

      - name: Inspect OIDC token claims
        run: |
          TOKEN=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value)
          echo "$TOKEN" | jq -R 'split(".")[1] | @base64d | fromjson | {sub, aud, iss}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-secrets.outputs.role_arn }}
          aws-region: ${{ steps.aws-secrets.outputs.region }}
          audience: sts.amazonaws.com

      - name: Build web app for CDK synth
        run: npm run build -w @animal-sound-game/web

      - name: Bootstrap CDK
        run: |
          npx cdk bootstrap aws://963777545862/${{ env.AWS_REGION }}
          npx cdk bootstrap aws://963777545862/us-east-1
        working-directory: infra

      - name: Deploy certificate stack
        run: npm run deploy:cert
        working-directory: infra

      - name: Deploy API stack
        run: npm run deploy:api
        working-directory: infra

      - name: Resolve API URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name AnimalSoundGame-ApiStack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Build web app with API URL
        run: VITE_API_URL=${{ steps.api.outputs.url }} npm run build -w @animal-sound-game/web

      - name: Deploy web and CI stacks
        run: npx cdk deploy AnimalSoundGame-WebStack AnimalSoundGame-CiStack --require-approval never
        working-directory: infra
